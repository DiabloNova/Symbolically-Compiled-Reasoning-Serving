name: SCRS public research data validation

on:
  pull_request:
    paths:
      - "data/manifests/**"
      - "data/public/legalbench/**"
      - "scripts/data/**"
      - "scripts/evaluation/**"
      - "tests/test_public_data_acquisition.py"
      - "tests/test_public_evidence_snapshot_verification.py"
      - "tests/test_legalbench_scoring.py"
      - "results/public-benchmarks/experiment-plan.v1.json"
      - "docs/free-public-evidence-acquisition.md"
      - ".github/workflows/research-data-validation.yml"

permissions:
  contents: read

jobs:
  public-data-validation:
    name: Verify pinned data, acquisition, and scorer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile data and scoring tools
        run: >-
          python -m py_compile
          scripts/data/acquire_public_evidence.py
          scripts/data/verify_public_evidence_snapshot.py
          scripts/evaluation/score_legalbench.py
          tests/test_public_data_acquisition.py
          tests/test_public_evidence_snapshot_verification.py
          tests/test_legalbench_scoring.py
      - name: Validate acquisition contract
        run: python -m unittest discover -s tests -p "test_public_data_acquisition.py" -v
      - name: Validate snapshot integrity contract
        run: python -m unittest discover -s tests -p "test_public_evidence_snapshot_verification.py" -v
      - name: Validate scorer contract
        run: python -m unittest discover -s tests -p "test_legalbench_scoring.py" -v
      - name: Verify the complete pinned public data archive
        run: python scripts/data/verify_public_evidence_snapshot.py
      - name: Validate experiment plan JSON
        run: python -m json.tool results/public-benchmarks/experiment-plan.v1.json > /dev/null
